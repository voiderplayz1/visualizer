<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lissajous</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400&display=swap');

:root {
    --accent: #000000;
    --bg: #ffffff;
    --border: rgba(0,0,0,0.13);
    --border-mid: rgba(0,0,0,0.28);
    --panel-bg: rgba(255,255,255,0.92);
    --text-muted: rgba(0,0,0,0.7);
    --text-dim: rgba(0,0,0,0.42);
    --font: 'EB Garamond', Georgia, 'Times New Roman', serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: var(--bg);
    color: var(--accent);
    font-family: var(--font);
    height: 100vh;
    overflow: hidden;
}

canvas { display: block; }
#main-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; }
#glow-canvas  { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
#node-canvas  { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }

/* Hamburger */
#hamburger {
    position: fixed; top: 14px; left: 14px; z-index: 999;
    width: 34px; height: 34px;
    background: rgba(255,255,255,0.85); backdrop-filter: blur(16px);
    border: 1px solid var(--border); border-radius: 4px;
    cursor: pointer; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 5px;
    transition: border-color 0.2s, background 0.2s;
}
#hamburger:hover { border-color: var(--border-mid); }
#hamburger span { display: block; width: 14px; height: 1px; background: var(--text-muted); transition: background 0.2s; }
#hamburger:hover span { background: #000; }

/* Panel */
.panel {
    position: fixed;
    background: var(--panel-bg);
    backdrop-filter: blur(32px) saturate(1.2);
    border: 1px solid var(--border);
    border-radius: 4px;
    z-index: 100;
    box-shadow: 0 8px 40px rgba(0,0,0,0.10);
    transition: transform 0.45s cubic-bezier(0.4,0,0.2,1), opacity 0.35s ease;
    overflow: hidden;
}
#controls { top: 14px; left: 58px; width: 260px; }
#controls.hidden { transform: translateX(calc(-100% - 80px)); opacity: 0; pointer-events: none; }

.panel-header {
    padding: 12px 16px 10px;
    border-bottom: 1px solid rgba(0,0,0,0.07);
    display: flex; align-items: center; gap: 8px;
    cursor: grab; user-select: none;
}
.panel-header:active { cursor: grabbing; }
.panel-title { font-size: 0.78rem; letter-spacing: 5px; text-transform: uppercase; color: var(--text-dim); flex: 1; }

.panel-section {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    display: flex; flex-direction: column; gap: 10px;
}
.panel-section:last-child { border-bottom: none; padding-bottom: 16px; }

.section-label {
    font-size: 0.72rem; letter-spacing: 4px; text-transform: uppercase;
    color: var(--text-dim); font-style: italic;
}

/* Buttons */
.btn {
    width: 100%; padding: 9px 14px;
    border: 1px solid var(--border); border-radius: 60px;
    background: rgba(0,0,0,0.03); color: var(--text-muted);
    font-family: var(--font); font-size: 0.88rem;
    letter-spacing: 3px; text-transform: uppercase;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: border-color 0.2s, background 0.2s, color 0.2s;
}
.btn:hover { border-color: var(--border-mid); background: rgba(0,0,0,0.07); color: #000; }
.btn-square { border-radius: 4px; }

.btn-record { border-color: rgba(200,50,40,0.22); color: rgba(180,60,50,0.75); background: rgba(200,50,40,0.04); }
.btn-record:hover { border-color: rgba(200,50,40,0.45); color: rgba(180,50,40,1); background: rgba(200,50,40,0.09); }
.btn-record.recording { border-color: rgba(200,50,40,0.55); color: rgba(180,50,40,1); background: rgba(200,50,40,0.12); animation: pulse-rec 1.5s ease-in-out infinite; }
@keyframes pulse-rec { 0%,100%{box-shadow:0 0 0 0 rgba(200,50,40,0);}50%{box-shadow:0 0 0 4px rgba(200,50,40,0.1);} }

.btn-capture { border-color: rgba(0,100,220,0.2); color: rgba(0,80,200,0.7); background: rgba(0,100,220,0.04); }
.btn-capture:hover { border-color: rgba(0,100,220,0.4); color: rgba(0,80,200,1); background: rgba(0,100,220,0.09); }
.btn-capture.active { border-color: rgba(200,50,40,0.45); color: rgba(180,50,40,1); background: rgba(200,50,40,0.09); animation: pulse-cap 2s ease-in-out infinite; }
@keyframes pulse-cap { 0%,100%{box-shadow:0 0 0 0 rgba(200,50,40,0);}50%{box-shadow:0 0 0 4px rgba(200,50,40,0.1);} }

.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.btn-record.recording .dot,
.btn-capture.active .dot { animation: blink 1.1s step-start infinite; }
@keyframes blink { 0%,100%{opacity:1}50%{opacity:0.1} }

.btn-toggle-on  { border-color: rgba(0,0,0,0.22); color: rgba(0,0,0,0.75); background: rgba(0,0,0,0.05); }
.btn-toggle-off { border-color: rgba(0,0,0,0.1);  color: rgba(0,0,0,0.32);  background: rgba(0,0,0,0.02); }

.btn-version {
    border-color: rgba(80,0,180,0.2); color: rgba(80,0,180,0.7); background: rgba(80,0,180,0.04);
}
.btn-version:hover { border-color: rgba(80,0,180,0.4); color: rgba(80,0,180,1); background: rgba(80,0,180,0.09); }
.btn-version.legacy { border-color: rgba(180,80,0,0.3); color: rgba(160,70,0,0.8); background: rgba(180,80,0,0.05); }

/* Node edit toggle */
.btn-nodes-edit {
    border-color: rgba(0,150,100,0.25); color: rgba(0,130,85,0.8); background: rgba(0,150,100,0.04);
}
.btn-nodes-edit:hover { border-color: rgba(0,150,100,0.45); color: rgba(0,120,80,1); background: rgba(0,150,100,0.09); }
.btn-nodes-edit.active {
    border-color: rgba(0,150,100,0.55); color: rgba(0,120,80,1); background: rgba(0,150,100,0.12);
    animation: pulse-node 2s ease-in-out infinite;
}
@keyframes pulse-node { 0%,100%{box-shadow:0 0 0 0 rgba(0,150,100,0);}50%{box-shadow:0 0 0 4px rgba(0,150,100,0.12);} }

/* Node add button */
.btn-add-node {
    border-color: rgba(0,150,100,0.2); color: rgba(0,130,85,0.7); background: rgba(0,150,100,0.03);
}
.btn-add-node:hover { border-color: rgba(0,150,100,0.4); color: rgba(0,120,80,1); background: rgba(0,150,100,0.08); }
.btn-add-node:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-add-node:disabled:hover { border-color: rgba(0,150,100,0.2); color: rgba(0,130,85,0.7); background: rgba(0,150,100,0.03); }

/* Sliders */
.ctrl-row { display: flex; flex-direction: column; gap: 5px; }
.ctrl-label {
    font-size: 0.85rem; letter-spacing: 1.5px; text-transform: uppercase;
    color: #000; display: flex; justify-content: space-between;
}
.ctrl-val { color: #000; opacity: 0.55; font-variant-numeric: tabular-nums; letter-spacing: 0; font-style: italic; }

input[type="range"] {
    width: 100%; height: 1px; appearance: none; -webkit-appearance: none;
    background: rgba(0,0,0,0.18); border-radius: 1px; outline: none; cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 9px; height: 9px; border-radius: 50%;
    background: #000; box-shadow: 0 0 8px rgba(0,0,0,0.35); cursor: pointer;
}
input[type="range"]::-moz-range-thumb {
    width: 9px; height: 9px; border-radius: 50%; border: none;
    background: #000; box-shadow: 0 0 8px rgba(0,0,0,0.35);
}

/* Color pickers */
.color-row { display: flex; flex-direction: column; gap: 5px; }
input[type="color"] {
    width: 100%; height: 30px; background: rgba(0,0,0,0.03);
    border: 1px solid var(--border); border-radius: 3px;
    cursor: pointer; padding: 3px 6px; transition: border-color 0.2s;
}
input[type="color"]:hover { border-color: var(--border-mid); }

/* Node color picker for add flow */
.node-color-row {
    display: flex; align-items: center; gap: 8px;
}
.node-color-row input[type="color"] {
    width: 38px; height: 30px; flex-shrink: 0;
}
.node-color-row .node-color-label {
    font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase;
    color: var(--text-dim); font-style: italic;
}

/* Node list */
.node-list { display: flex; flex-direction: column; gap: 6px; }
.node-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 4px;
    background: rgba(0,0,0,0.025); border: 1px solid var(--border);
    font-size: 0.82rem; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text-muted);
}
.node-swatch {
    width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
    border: 1px solid rgba(0,0,0,0.12);
}
.node-label { flex: 1; }
.node-remove {
    width: 18px; height: 18px; border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.12); background: transparent;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--text-dim); line-height: 1;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
    flex-shrink: 0;
}
.node-remove:hover { border-color: rgba(200,50,40,0.4); color: rgba(200,50,40,0.85); background: rgba(200,50,40,0.06); }

/* Influence radius slider */
.ctrl-row-sm { display: flex; flex-direction: column; gap: 4px; }

.tip { font-size: 0.78rem; letter-spacing: 0.2px; color: var(--text-dim); line-height: 1.6; font-style: italic; }

/* Node pending color picker overlay */
#node-color-overlay {
    position: fixed; inset: 0; z-index: 500;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.18); backdrop-filter: blur(4px);
}
#node-color-overlay.visible { display: flex; }
#node-color-box {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 22px 24px;
    box-shadow: 0 12px 48px rgba(0,0,0,0.18);
    display: flex; flex-direction: column; gap: 16px;
    min-width: 220px;
}
#node-color-box h3 {
    font-size: 0.78rem; letter-spacing: 5px; text-transform: uppercase;
    color: var(--text-dim); font-weight: 400;
}
#node-color-box input[type="color"] { width: 100%; height: 44px; }
.node-overlay-btns { display: flex; gap: 8px; }
.node-overlay-btns .btn { font-size: 0.8rem; padding: 7px 10px; letter-spacing: 2px; }
</style>
</head>
<body>

<canvas id="main-canvas"></canvas>
<canvas id="glow-canvas"></canvas>
<canvas id="node-canvas"></canvas>

<button id="hamburger" title="Toggle panel">
    <span></span><span></span><span></span>
</button>

<!-- Node color picker overlay -->
<div id="node-color-overlay">
    <div id="node-color-box">
        <h3>Node Color</h3>
        <input type="color" id="new-node-color-input" value="#ff4400">
        <div class="node-overlay-btns">
            <button class="btn btn-square" id="node-color-cancel" style="flex:1">Cancel</button>
            <button class="btn btn-square btn-add-node" id="node-color-confirm" style="flex:1">Place ↓</button>
        </div>
    </div>
</div>

<div id="controls" class="panel">
    <div class="panel-header" id="controls-handle">
        <span class="panel-title"></span>
    </div>

    <!-- Source -->
    <div class="panel-section">
        <span class="section-label">Source</span>
        <button id="btn-record" class="btn btn-record"><span class="dot"></span>Record video</button>
        <button id="btn-capture" class="btn btn-capture"><span class="dot"></span>Capture app / tab</button>
        <p class="tip">Tick "Share audio" in the browser picker.</p>
    </div>

    <!-- Colors -->
    <div class="panel-section">
        <span class="section-label">Colors</span>
        <div class="color-row">
            <span class="ctrl-label">Background</span>
            <input type="color" id="bg-color-picker" value="#ffffff">
        </div>
        <div class="color-row">
            <span class="ctrl-label">Base line color</span>
            <input type="color" id="color-picker" value="#000000">
        </div>
    </div>

    <!-- Lissajous controls -->
    <div class="panel-section">
        <span class="section-label">Shape</span>
        <div class="ctrl-row">
            <label class="ctrl-label"><span>Density + spread</span><span class="ctrl-val" id="val-liss-density">15</span></label>
            <input type="range" id="fx-liss-density" min="1" max="1500" step="1" value="15">
        </div>
        <div class="ctrl-row">
            <label class="ctrl-label"><span>Thickness</span><span class="ctrl-val" id="val-thickness">0.50</span></label>
            <input type="range" id="fx-thickness" min="0.1" max="5.0" step="0.01" value="0.5">
        </div>
        <div class="ctrl-row">
            <label class="ctrl-label"><span>Glow</span><span class="ctrl-val" id="val-glow">1.00</span></label>
            <input type="range" id="fx-glow" min="0.0" max="5.0" step="0.01" value="1.0">
        </div>
        <button id="btn-rotation-toggle" class="btn btn-square btn-toggle-on">Toggle: Rotation ✓</button>
    </div>

    <!-- Color Nodes -->
    <div class="panel-section">
        <span class="section-label">Color Nodes</span>
        <div class="ctrl-row-sm">
            <label class="ctrl-label"><span>Influence radius</span><span class="ctrl-val" id="val-node-radius">280</span></label>
            <input type="range" id="fx-node-radius" min="40" max="800" step="1" value="280">
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
            <button id="btn-nodes-edit" class="btn btn-square btn-nodes-edit" style="flex:1">Edit Nodes</button>
            <button id="btn-add-node" class="btn btn-square btn-add-node" style="flex:1" disabled>+ Add Node</button>
        </div>
        <div id="node-list" class="node-list"></div>
        <p class="tip" id="node-tip" style="display:none">Click node to delete · drag to move</p>
    </div>

    <!-- Version swap -->
    <div class="panel-section">
        <span class="section-label">Version</span>
        <button id="btn-version" class="btn btn-version">Switch to Legacy ↻</button>
    </div>
</div>

<script>
// ── Canvas setup ──────────────────────────────────────────────────────────────
const mainCanvas = document.getElementById('main-canvas');
const mainCtx    = mainCanvas.getContext('2d');
const glowCanvas = document.getElementById('glow-canvas');
const glowCtx    = glowCanvas.getContext('2d');
const nodeCanvas = document.getElementById('node-canvas');
const nodeCtx    = nodeCanvas.getContext('2d');

// ── State ─────────────────────────────────────────────────────────────────────
const state = {
    mode: 'lissajous',
    color: '#000000',
    bgColor: '#ffffff',
    thickness: 0.5,
    glow: 1.0,
    lissOffset: 15,
    lissSpread: 0.25 + (15/1000)*1.75,
    rotationEnabled: true,
    nodeEditMode: false,
    nodeRadius: 280,
    nodes: [], // { x, y, color, r, g, b }
};

// ── Audio ─────────────────────────────────────────────────────────────────────
let audioCtx, analyser, preAnalyser;
let captureStream = null, captureSource = null;
let mediaRecorder = null, recordChunks = [], isRecording = false;
let animationId = null;

// ── Resize ────────────────────────────────────────────────────────────────────
function resize() {
    mainCanvas.width = window.innerWidth;  mainCanvas.height = window.innerHeight;
    glowCanvas.width = window.innerWidth;  glowCanvas.height = window.innerHeight;
    nodeCanvas.width = window.innerWidth;  nodeCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resize); resize();

// ── Audio graph ───────────────────────────────────────────────────────────────
function initAudioGraph() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    preAnalyser = audioCtx.createAnalyser(); preAnalyser.fftSize = 2048; preAnalyser.smoothingTimeConstant = 0.5;
    analyser    = audioCtx.createAnalyser(); analyser.fftSize = 2048;    analyser.smoothingTimeConstant = 0.5;
    const vol = audioCtx.createGain(); vol.gain.value = 1;
    preAnalyser.connect(vol); vol.connect(analyser);
}
function connectSource(node) { node.connect(preAnalyser); }

// ── Record ────────────────────────────────────────────────────────────────────
const btnRecord  = document.getElementById('btn-record');
const btnCapture = document.getElementById('btn-capture');
const REC_W = 1280, REC_H = 720;
let recOffscreen = null, recOffCtx = null, recAnimId = null;

btnRecord.addEventListener('click', () => isRecording ? stopRecording() : startRecording());

function startRecording() {
    if (!audioCtx) { alert('Capture audio first.'); return; }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    recOffscreen = document.createElement('canvas');
    recOffscreen.width = REC_W; recOffscreen.height = REC_H;
    recOffCtx = recOffscreen.getContext('2d');
    function compositeFrame() {
        if (!isRecording) return;
        recOffCtx.fillStyle = state.bgColor;
        recOffCtx.fillRect(0, 0, REC_W, REC_H);
        recOffCtx.drawImage(mainCanvas, 0, 0, mainCanvas.width, mainCanvas.height, 0, 0, REC_W, REC_H);
        recAnimId = requestAnimationFrame(compositeFrame);
    }
    recAnimId = requestAnimationFrame(compositeFrame);
    const cs = recOffscreen.captureStream(60);
    const ad = audioCtx.createMediaStreamDestination(); analyser.connect(ad);
    const at = ad.stream.getAudioTracks()[0]; if (at) cs.addTrack(at);
    const mime = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']
        .find(t => MediaRecorder.isTypeSupported(t)) || 'video/webm';
    mediaRecorder = new MediaRecorder(cs, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
    recordChunks = [];
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordChunks.push(e.data); };
    mediaRecorder.onstop = () => {
        cancelAnimationFrame(recAnimId); recAnimId = null;
        analyser.disconnect(ad);
        const blob = new Blob(recordChunks, { type: mime });
        const url  = URL.createObjectURL(blob);
        Object.assign(document.createElement('a'), { href: url, download: `lissajous-${Date.now()}.webm` }).click();
        URL.revokeObjectURL(url);
    };
    mediaRecorder.start(); isRecording = true;
    btnRecord.classList.add('recording');
    btnRecord.innerHTML = '<span class="dot"></span>Stop & save';
}

function stopRecording() {
    if (mediaRecorder?.state !== 'inactive') mediaRecorder.stop();
    cancelAnimationFrame(recAnimId); recAnimId = null;
    isRecording = false;
    btnRecord.classList.remove('recording');
    btnRecord.innerHTML = '<span class="dot"></span>Record video';
}

// ── Screenshare ────────────────────────────────────────────────────────────────
btnCapture.addEventListener('click', async () => {
    if (captureStream) { stopCapture(); return; }
    try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
            video: true,
            audio: { echoCancellation: false, noiseSuppression: false, sampleRate: 44100 }
        });
        stream.getVideoTracks().forEach(t => t.stop());
        const audioTracks = stream.getAudioTracks();
        if (!audioTracks.length) {
            alert('No audio track — tick "Share audio" in the picker.');
            stream.getTracks().forEach(t => t.stop()); return;
        }
        initAudioGraph();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        captureStream = stream;
        captureSource = audioCtx.createMediaStreamSource(captureStream);
        connectSource(captureSource);
        btnCapture.classList.add('active');
        btnCapture.innerHTML = '<span class="dot"></span>Stop capture';
        audioTracks[0].addEventListener('ended', stopCapture);
        if (!animationId) draw();
    } catch (err) {
        if (err.name !== 'NotAllowedError') alert(`Capture failed: ${err.message}`);
    }
});

function stopCapture() {
    captureStream?.getTracks().forEach(t => t.stop());
    captureSource?.disconnect();
    captureStream = captureSource = null;
    btnCapture.classList.remove('active');
    btnCapture.innerHTML = '<span class="dot"></span>Capture app / tab';
}

// ── Color pickers ─────────────────────────────────────────────────────────────
document.getElementById('color-picker').oninput = e => {
    state.color = e.target.value;
    document.documentElement.style.setProperty('--accent', state.color);
};
document.getElementById('bg-color-picker').oninput = e => {
    state.bgColor = e.target.value;
    document.documentElement.style.setProperty('--bg', state.bgColor);
    document.body.style.background = state.bgColor;
    const hex = e.target.value.slice(1);
    const r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);
    const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
    const dark = lum < 0.5;
    document.documentElement.style.setProperty('--border',       dark ? 'rgba(255,255,255,0.13)' : 'rgba(0,0,0,0.13)');
    document.documentElement.style.setProperty('--border-mid',   dark ? 'rgba(255,255,255,0.28)' : 'rgba(0,0,0,0.28)');
    document.documentElement.style.setProperty('--panel-bg',     dark ? 'rgba(10,10,10,0.88)'    : 'rgba(255,255,255,0.92)');
    document.documentElement.style.setProperty('--text-muted',   dark ? 'rgba(255,255,255,0.7)'  : 'rgba(0,0,0,0.7)');
    document.documentElement.style.setProperty('--text-dim',     dark ? 'rgba(255,255,255,0.4)'  : 'rgba(0,0,0,0.42)');
};

// ── Sliders ───────────────────────────────────────────────────────────────────
function bindSlider(id, fmt, cb) {
    const el = document.getElementById('fx-' + id);
    const dv = document.getElementById('val-' + id);
    if (!el) return;
    el.oninput = e => { const v = parseFloat(e.target.value); if (dv) dv.textContent = fmt(v); cb(v); };
}
bindSlider('liss-density', v => Math.round(v), v => {
    const vi = Math.round(v);
    state.lissOffset = vi;
    state.lissSpread = 0.25 + (vi/1000)*1.75;
    document.getElementById('val-liss-density').textContent = vi;
});
bindSlider('thickness', v => v.toFixed(2), v => state.thickness = v);
bindSlider('glow',      v => v.toFixed(2), v => state.glow = v);
bindSlider('node-radius', v => Math.round(v), v => state.nodeRadius = v);

// ── Rotation ──────────────────────────────────────────────────────────────────
const btnRotation = document.getElementById('btn-rotation-toggle');
btnRotation.addEventListener('click', () => {
    state.rotationEnabled = !state.rotationEnabled;
    btnRotation.textContent = 'Toggle: Rotation ' + (state.rotationEnabled ? '✓' : '✗');
    btnRotation.className = 'btn btn-square ' + (state.rotationEnabled ? 'btn-toggle-on' : 'btn-toggle-off');
});

// ── Version swap ──────────────────────────────────────────────────────────────
const btnVersion = document.getElementById('btn-version');
btnVersion.addEventListener('click', () => {
    if (state.mode === 'lissajous') {
        state.mode = 'legacy';
        btnVersion.textContent = 'Switch to V2 ↻';
        btnVersion.classList.add('legacy');
    } else {
        state.mode = 'lissajous';
        btnVersion.textContent = 'Switch to Legacy ↻';
        btnVersion.classList.remove('legacy');
    }
    const bg = hexToRgb(state.bgColor);
    mainCtx.fillStyle = `rgb(${bg.r},${bg.g},${bg.b})`;
    mainCtx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
    glowCtx.clearRect(0, 0, glowCanvas.width, glowCanvas.height);
    drawPhase = 0;
});

// ── Hamburger / drag ──────────────────────────────────────────────────────────
const controls  = document.getElementById('controls');
const hamburger = document.getElementById('hamburger');
let guiVisible = true;
hamburger.onclick = () => {
    guiVisible = !guiVisible;
    controls.classList.toggle('hidden', !guiVisible);
};

function makeDraggable(panel, handle) {
    let sx, sy, ox, oy, drag = false;
    handle.addEventListener('mousedown', e => {
        if (e.button) return; drag = true; sx = e.clientX; sy = e.clientY;
        const r = panel.getBoundingClientRect(); ox = r.left; oy = r.top;
        panel.style.transition = 'none'; e.preventDefault();
    });
    window.addEventListener('mousemove', e => {
        if (!drag) return;
        panel.style.left = Math.max(0, ox + e.clientX - sx) + 'px';
        panel.style.top  = Math.max(0, oy + e.clientY - sy) + 'px';
    });
    window.addEventListener('mouseup', () => { if (!drag) return; drag = false; panel.style.transition = ''; });
}
makeDraggable(controls, document.getElementById('controls-handle'));
makeDraggable(hamburger, hamburger);

// ── Helper ────────────────────────────────────────────────────────────────────
function hexToRgb(hex) {
    return { r: parseInt(hex.slice(1,3),16), g: parseInt(hex.slice(3,5),16), b: parseInt(hex.slice(5,7),16) };
}

// ── Color Node System ─────────────────────────────────────────────────────────
const btnNodesEdit = document.getElementById('btn-nodes-edit');
const btnAddNode   = document.getElementById('btn-add-node');
const nodeListEl   = document.getElementById('node-list');
const nodeTip      = document.getElementById('node-tip');
const nodeOverlay  = document.getElementById('node-color-overlay');
const newNodeColorInput = document.getElementById('new-node-color-input');

// Node interaction state
let nodeDragging = null;   // { index, startX, startY, origX, origY }
let nodePointerDown = null; // { index, x, y, time }
const NODE_HIT_R = 22;     // px hit radius
const DRAG_THRESHOLD = 6;  // px to decide drag vs click
let nodeHovering = -1;

// Toggle edit mode
btnNodesEdit.addEventListener('click', () => {
    state.nodeEditMode = !state.nodeEditMode;
    btnNodesEdit.textContent = state.nodeEditMode ? 'Done Editing ✓' : 'Edit Nodes';
    btnNodesEdit.classList.toggle('active', state.nodeEditMode);
    btnAddNode.disabled = !state.nodeEditMode;
    nodeTip.style.display = state.nodeEditMode && state.nodes.length > 0 ? 'block' : 'none';
    if (!state.nodeEditMode) {
        nodeCtx.clearRect(0, 0, nodeCanvas.width, nodeCanvas.height);
    }
    updateNodeCanvas();
});

// Add node flow — show color picker overlay
btnAddNode.addEventListener('click', () => {
    if (state.nodes.length >= 5) return;
    nodeOverlay.classList.add('visible');
});

document.getElementById('node-color-cancel').addEventListener('click', () => {
    nodeOverlay.classList.remove('visible');
});

document.getElementById('node-color-confirm').addEventListener('click', () => {
    nodeOverlay.classList.remove('visible');
    const color = newNodeColorInput.value;
    const rgb = hexToRgb(color);
    const node = {
        x: mainCanvas.width / 2,
        y: mainCanvas.height / 2,
        color,
        r: rgb.r, g: rgb.g, b: rgb.b,
        label: `Node ${state.nodes.length + 1}`
    };
    state.nodes.push(node);
    renderNodeList();
    updateNodeCanvas();
    nodeTip.style.display = 'block';
    if (state.nodes.length >= 5) btnAddNode.disabled = true;
});

function renderNodeList() {
    nodeListEl.innerHTML = '';
    state.nodes.forEach((nd, i) => {
        const item = document.createElement('div');
        item.className = 'node-item';
        item.innerHTML = `
            <span class="node-swatch" style="background:${nd.color}"></span>
            <span class="node-label">${nd.label}</span>
            <button class="node-remove" data-idx="${i}" title="Remove">✕</button>
        `;
        nodeListEl.appendChild(item);
    });
    nodeListEl.querySelectorAll('.node-remove').forEach(btn => {
        btn.addEventListener('click', e => {
            const idx = parseInt(e.currentTarget.dataset.idx);
            state.nodes.splice(idx, 1);
            // re-label
            state.nodes.forEach((n, i) => n.label = `Node ${i+1}`);
            renderNodeList();
            updateNodeCanvas();
            if (state.nodes.length < 5 && state.nodeEditMode) btnAddNode.disabled = false;
            nodeTip.style.display = state.nodeEditMode && state.nodes.length > 0 ? 'block' : 'none';
        });
    });
}

// ── Node canvas interaction ────────────────────────────────────────────────────
nodeCanvas.style.pointerEvents = 'auto'; // always listen, but only act in edit mode

function getNodeAtPoint(x, y) {
    for (let i = state.nodes.length - 1; i >= 0; i--) {
        const nd = state.nodes[i];
        const dx = nd.x - x, dy = nd.y - y;
        if (Math.sqrt(dx*dx + dy*dy) <= NODE_HIT_R) return i;
    }
    return -1;
}

nodeCanvas.addEventListener('mousedown', e => {
    if (!state.nodeEditMode) return;
    const idx = getNodeAtPoint(e.clientX, e.clientY);
    if (idx < 0) return;
    e.preventDefault();
    nodePointerDown = { index: idx, x: e.clientX, y: e.clientY, time: Date.now() };
    nodeDragging = null;
});

window.addEventListener('mousemove', e => {
    if (!state.nodeEditMode) return;

    // hover detection
    const hov = getNodeAtPoint(e.clientX, e.clientY);
    if (hov !== nodeHovering) {
        nodeHovering = hov;
        nodeCanvas.style.cursor = hov >= 0 ? 'grab' : 'default';
        updateNodeCanvas();
    }

    if (!nodePointerDown) return;
    const dx = e.clientX - nodePointerDown.x;
    const dy = e.clientY - nodePointerDown.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (!nodeDragging && dist > DRAG_THRESHOLD) {
        nodeDragging = { index: nodePointerDown.index };
        nodeCanvas.style.cursor = 'grabbing';
    }
    if (nodeDragging) {
        state.nodes[nodeDragging.index].x = Math.max(0, Math.min(mainCanvas.width,  e.clientX));
        state.nodes[nodeDragging.index].y = Math.max(0, Math.min(mainCanvas.height, e.clientY));
        updateNodeCanvas();
    }
});

window.addEventListener('mouseup', e => {
    if (!state.nodeEditMode) { nodePointerDown = null; nodeDragging = null; return; }
    if (nodePointerDown && !nodeDragging) {
        // it's a click — delete node
        const idx = getNodeAtPoint(e.clientX, e.clientY);
        if (idx >= 0 && idx === nodePointerDown.index) {
            state.nodes.splice(idx, 1);
            state.nodes.forEach((n, i) => n.label = `Node ${i+1}`);
            renderNodeList();
            updateNodeCanvas();
            if (state.nodes.length < 5) btnAddNode.disabled = false;
            nodeTip.style.display = state.nodeEditMode && state.nodes.length > 0 ? 'block' : 'none';
        }
    }
    nodePointerDown = null;
    nodeDragging = null;
    if (state.nodeEditMode) nodeCanvas.style.cursor = nodeHovering >= 0 ? 'grab' : 'default';
});

// Touch support for nodes
nodeCanvas.addEventListener('touchstart', e => {
    if (!state.nodeEditMode) return;
    const t = e.touches[0];
    const idx = getNodeAtPoint(t.clientX, t.clientY);
    if (idx < 0) return;
    e.preventDefault();
    nodePointerDown = { index: idx, x: t.clientX, y: t.clientY, time: Date.now() };
    nodeDragging = null;
}, { passive: false });

window.addEventListener('touchmove', e => {
    if (!state.nodeEditMode || !nodePointerDown) return;
    e.preventDefault();
    const t = e.touches[0];
    const dx = t.clientX - nodePointerDown.x;
    const dy = t.clientY - nodePointerDown.y;
    if (!nodeDragging && Math.sqrt(dx*dx+dy*dy) > DRAG_THRESHOLD) {
        nodeDragging = { index: nodePointerDown.index };
    }
    if (nodeDragging) {
        state.nodes[nodeDragging.index].x = Math.max(0, Math.min(mainCanvas.width,  t.clientX));
        state.nodes[nodeDragging.index].y = Math.max(0, Math.min(mainCanvas.height, t.clientY));
        updateNodeCanvas();
    }
}, { passive: false });

window.addEventListener('touchend', e => {
    if (!state.nodeEditMode) { nodePointerDown = null; nodeDragging = null; return; }
    if (nodePointerDown && !nodeDragging) {
        const t = e.changedTouches[0];
        const idx = getNodeAtPoint(t.clientX, t.clientY);
        if (idx >= 0 && idx === nodePointerDown.index) {
            state.nodes.splice(idx, 1);
            state.nodes.forEach((n, i) => n.label = `Node ${i+1}`);
            renderNodeList();
            updateNodeCanvas();
            if (state.nodes.length < 5) btnAddNode.disabled = false;
            nodeTip.style.display = state.nodeEditMode && state.nodes.length > 0 ? 'block' : 'none';
        }
    }
    nodePointerDown = null;
    nodeDragging = null;
});

let nodeAnimPhase = 0;
function updateNodeCanvas() {
    if (!state.nodeEditMode) {
        nodeCtx.clearRect(0, 0, nodeCanvas.width, nodeCanvas.height);
        return;
    }
    nodeCtx.clearRect(0, 0, nodeCanvas.width, nodeCanvas.height);
    const w = nodeCanvas.width, h = nodeCanvas.height;

    // Draw influence radius outlines + node circles
    state.nodes.forEach((nd, i) => {
        const isHover = i === nodeHovering;
        const isDrag  = nodeDragging && nodeDragging.index === i;
        const rad = state.nodeRadius;

        // Influence ring
        nodeCtx.save();
        const gr = nodeCtx.createRadialGradient(nd.x, nd.y, 0, nd.x, nd.y, rad);
        gr.addColorStop(0,   `rgba(${nd.r},${nd.g},${nd.b},0.08)`);
        gr.addColorStop(0.7, `rgba(${nd.r},${nd.g},${nd.b},0.04)`);
        gr.addColorStop(1,   `rgba(${nd.r},${nd.g},${nd.b},0.0)`);
        nodeCtx.beginPath();
        nodeCtx.arc(nd.x, nd.y, rad, 0, Math.PI * 2);
        nodeCtx.fillStyle = gr;
        nodeCtx.fill();

        // Dashed ring
        nodeCtx.beginPath();
        nodeCtx.arc(nd.x, nd.y, rad, 0, Math.PI * 2);
        nodeCtx.setLineDash([6, 5]);
        nodeCtx.strokeStyle = `rgba(${nd.r},${nd.g},${nd.b},${isHover ? 0.55 : 0.28})`;
        nodeCtx.lineWidth = 1;
        nodeCtx.stroke();
        nodeCtx.setLineDash([]);
        nodeCtx.restore();

        // Node circle
        const nodeR = isDrag ? 12 : (isHover ? 11 : 9);
        const innerR = 5;

        // Outer halo
        nodeCtx.save();
        nodeCtx.beginPath();
        nodeCtx.arc(nd.x, nd.y, nodeR + 4, 0, Math.PI * 2);
        nodeCtx.fillStyle = `rgba(${nd.r},${nd.g},${nd.b},${isHover || isDrag ? 0.18 : 0.08})`;
        nodeCtx.fill();

        // Main circle
        nodeCtx.beginPath();
        nodeCtx.arc(nd.x, nd.y, nodeR, 0, Math.PI * 2);
        nodeCtx.fillStyle = nd.color;
        nodeCtx.fill();

        // White center dot
        nodeCtx.beginPath();
        nodeCtx.arc(nd.x, nd.y, innerR, 0, Math.PI * 2);
        nodeCtx.fillStyle = 'rgba(255,255,255,0.85)';
        nodeCtx.fill();

        // Delete hint on hover (small x)
        if (isHover && !isDrag) {
            nodeCtx.fillStyle = 'rgba(200,60,40,0.85)';
            nodeCtx.font = 'bold 8px sans-serif';
            nodeCtx.textAlign = 'center';
            nodeCtx.textBaseline = 'middle';
            nodeCtx.fillText('✕', nd.x, nd.y);
        }

        // Label
        nodeCtx.font = '500 11px "EB Garamond", Georgia, serif';
        nodeCtx.textAlign = 'center';
        nodeCtx.textBaseline = 'top';
        nodeCtx.fillStyle = `rgba(${nd.r},${nd.g},${nd.b},0.9)`;
        nodeCtx.fillText(nd.label, nd.x, nd.y + nodeR + 6);

        nodeCtx.restore();
    });
}

// ── Color node influence on a point ──────────────────────────────────────────
// Returns a blended RGB as [r, g, b] weighted by distance to each node
function getNodeInfluence(px, py) {
    if (state.nodes.length === 0) return null;
    const rad = state.nodeRadius;
    let totalW = 0;
    let rr = 0, gg = 0, bb = 0;
    state.nodes.forEach(nd => {
        const dx = px - nd.x, dy = py - nd.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < rad) {
            // smooth falloff: weight = (1 - dist/rad)^2
            const t = 1 - dist / rad;
            const w = t * t;
            rr += nd.r * w;
            gg += nd.g * w;
            bb += nd.b * w;
            totalW += w;
        }
    });
    if (totalW < 0.001) return null;
    return [rr / totalW, gg / totalW, bb / totalW, Math.min(1, totalW)];
}

// ── Draw phase ────────────────────────────────────────────────────────────────
let drawPhase = 0;

function draw() {
    animationId = requestAnimationFrame(draw);
    if (!analyser) return;

    if (state.rotationEnabled) drawPhase += 0.012;

    const bufLen = analyser.frequencyBinCount;
    const preBufLen = preAnalyser ? preAnalyser.frequencyBinCount : bufLen;
    const rawTime = new Uint8Array(preBufLen);
    if (preAnalyser) preAnalyser.getByteTimeDomainData(rawTime);
    const vRaw = rawTime;

    const w = mainCanvas.width, h = mainCanvas.height;
    const bg = hexToRgb(state.bgColor);
    const speedOsc = drawPhase;

    glowCtx.clearRect(0, 0, w, h);
    mainCtx.fillStyle = `rgb(${bg.r},${bg.g},${bg.b})`;
    mainCtx.fillRect(0, 0, w, h);

    // Base line color as rgb
    const baseRgb = hexToRgb(state.color);

    const hasNodes = state.nodes.length > 0;

    if (state.mode === 'lissajous') {
        const lissLen = Math.min(vRaw.length, 1024);
        const offset  = Math.min(state.lissOffset, lissLen - 1);
        const scl     = 0.5 * state.lissSpread;
        const cosR    = Math.cos(speedOsc * 0.05);
        const sinR    = Math.sin(speedOsc * 0.05);

        function lissGet(idx)  { const i = ((idx % lissLen) + lissLen) % lissLen; return (vRaw[i] - 128) / 128; }
        function lissGetY(idx) { const i = ((idx % lissLen) + lissLen) % lissLen; return (vRaw[((i + offset) % lissLen)] - 128) / 128; }
        function catmull(p0,p1,p2,p3,t) { return 0.5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t*t+(-p0+3*p1-3*p2+p3)*t*t*t); }

        const upsample   = Math.max(1, Math.min(8, Math.ceil(scl * 4)));
        const totalSteps = lissLen * upsample;

        if (!hasNodes) {
            // Standard single-color draw
            function buildPath(ctx) {
                ctx.beginPath();
                for (let s = 0; s < totalSteps; s++) {
                    const fi = s / upsample, i0 = Math.floor(fi), t = fi - i0;
                    const nx = catmull(lissGet(i0-1), lissGet(i0), lissGet(i0+1), lissGet(i0+2), t);
                    const ny = catmull(lissGetY(i0-1), lissGetY(i0), lissGetY(i0+1), lissGetY(i0+2), t);
                    const rx = nx * scl, ry = ny * scl;
                    const px = w/2 + (rx*cosR - ry*sinR) * w/2;
                    const py = h/2 + (rx*sinR + ry*cosR) * h/2;
                    s === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                }
                ctx.stroke();
            }
            mainCtx.shadowBlur  = Math.max(2, 18 * state.glow);
            mainCtx.shadowColor = state.color;
            mainCtx.strokeStyle = state.color;
            mainCtx.lineWidth   = 2 * state.thickness;
            mainCtx.lineCap = 'round'; mainCtx.lineJoin = 'round';
            buildPath(mainCtx);
            mainCtx.shadowBlur = 0;
            mainCtx.strokeStyle = state.color;
            mainCtx.lineWidth   = 1.5 * state.thickness;
            buildPath(mainCtx);
        } else {
            // Per-segment color based on node influence — draw short segments
            // Pre-compute all points
            const pts = [];
            for (let s = 0; s <= totalSteps; s++) {
                const fi = s / upsample, i0 = Math.floor(fi), t = fi - i0;
                const nx = catmull(lissGet(i0-1), lissGet(i0), lissGet(i0+1), lissGet(i0+2), t);
                const ny = catmull(lissGetY(i0-1), lissGetY(i0), lissGetY(i0+1), lissGetY(i0+2), t);
                const rx = nx * scl, ry = ny * scl;
                const px = w/2 + (rx*cosR - ry*sinR) * w/2;
                const py = h/2 + (rx*sinR + ry*cosR) * h/2;
                pts.push([px, py]);
            }

            // Group into runs of similar color for fewer ctx state changes
            // We sample midpoint of each segment for color
            const CHUNK = 4; // segments per chunk
            for (let s = 0; s < totalSteps; s += CHUNK) {
                const end = Math.min(s + CHUNK, totalSteps);
                // Midpoint of the chunk
                const mid = Math.floor((s + end) / 2);
                const [mpx, mpy] = pts[mid];
                const inf = getNodeInfluence(mpx, mpy);

                let r = baseRgb.r, g = baseRgb.g, b = baseRgb.b;
                if (inf) {
                    const [nr, ng, nb, nw] = inf;
                    const blend = Math.min(1, nw * 1.4);
                    r = Math.round(r * (1 - blend) + nr * blend);
                    g = Math.round(g * (1 - blend) + ng * blend);
                    b = Math.round(b * (1 - blend) + nb * blend);
                }
                const col = `rgb(${r},${g},${b})`;

                // Glow pass
                mainCtx.shadowBlur  = Math.max(2, 18 * state.glow);
                mainCtx.shadowColor = col;
                mainCtx.strokeStyle = col;
                mainCtx.lineWidth   = 2 * state.thickness;
                mainCtx.lineCap = 'round'; mainCtx.lineJoin = 'round';
                mainCtx.beginPath();
                mainCtx.moveTo(pts[s][0], pts[s][1]);
                for (let j = s+1; j <= end; j++) mainCtx.lineTo(pts[j][0], pts[j][1]);
                mainCtx.stroke();

                // Crisp pass
                mainCtx.shadowBlur = 0;
                mainCtx.strokeStyle = col;
                mainCtx.lineWidth = 1.5 * state.thickness;
                mainCtx.beginPath();
                mainCtx.moveTo(pts[s][0], pts[s][1]);
                for (let j = s+1; j <= end; j++) mainCtx.lineTo(pts[j][0], pts[j][1]);
                mainCtx.stroke();
            }
        }

    } else {
        // ── Legacy mode ──
        const lissLen = Math.min(vRaw.length, 1024);
        const offset  = Math.min(state.lissOffset, lissLen - 1);
        const scl     = 0.5 * state.lissSpread;
        const cosR    = Math.cos(speedOsc * 0.05);
        const sinR    = Math.sin(speedOsc * 0.05);

        if (!hasNodes) {
            function buildLegacyPath(ctx) {
                ctx.beginPath();
                for (let i = 0; i < lissLen; i++) {
                    const nx = (vRaw[i] - 128) / 128;
                    const ny = (vRaw[(i + offset) % lissLen] - 128) / 128;
                    const rx = nx * scl, ry = ny * scl;
                    const px = w/2 + (rx*cosR - ry*sinR) * w/2;
                    const py = h/2 + (rx*sinR + ry*cosR) * h/2;
                    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                }
                ctx.stroke();
            }
            mainCtx.shadowBlur  = Math.max(2, 18 * state.glow);
            mainCtx.shadowColor = state.color;
            mainCtx.strokeStyle = state.color;
            mainCtx.lineWidth   = 2 * state.thickness;
            mainCtx.lineCap = 'round'; mainCtx.lineJoin = 'round';
            buildLegacyPath(mainCtx);
            mainCtx.shadowBlur = 0;
            mainCtx.strokeStyle = state.color;
            mainCtx.lineWidth = 1.5 * state.thickness;
            buildLegacyPath(mainCtx);
        } else {
            const pts = [];
            for (let i = 0; i <= lissLen; i++) {
                const ii = i % lissLen;
                const nx = (vRaw[ii] - 128) / 128;
                const ny = (vRaw[(ii + offset) % lissLen] - 128) / 128;
                const rx = nx * scl, ry = ny * scl;
                const px = w/2 + (rx*cosR - ry*sinR) * w/2;
                const py = h/2 + (rx*sinR + ry*cosR) * h/2;
                pts.push([px, py]);
            }
            const CHUNK = 4;
            for (let s = 0; s < lissLen; s += CHUNK) {
                const end = Math.min(s + CHUNK, lissLen);
                const mid = Math.floor((s + end) / 2);
                const [mpx, mpy] = pts[mid];
                const inf = getNodeInfluence(mpx, mpy);
                let r = baseRgb.r, g = baseRgb.g, b = baseRgb.b;
                if (inf) {
                    const [nr, ng, nb, nw] = inf;
                    const blend = Math.min(1, nw * 1.4);
                    r = Math.round(r * (1-blend) + nr * blend);
                    g = Math.round(g * (1-blend) + ng * blend);
                    b = Math.round(b * (1-blend) + nb * blend);
                }
                const col = `rgb(${r},${g},${b})`;
                mainCtx.shadowBlur  = Math.max(2, 18 * state.glow);
                mainCtx.shadowColor = col;
                mainCtx.strokeStyle = col;
                mainCtx.lineWidth   = 2 * state.thickness;
                mainCtx.lineCap = 'round'; mainCtx.lineJoin = 'round';
                mainCtx.beginPath();
                mainCtx.moveTo(pts[s][0], pts[s][1]);
                for (let j = s+1; j <= end; j++) mainCtx.lineTo(pts[j][0], pts[j][1]);
                mainCtx.stroke();
                mainCtx.shadowBlur = 0;
                mainCtx.strokeStyle = col;
                mainCtx.lineWidth = 1.5 * state.thickness;
                mainCtx.beginPath();
                mainCtx.moveTo(pts[s][0], pts[s][1]);
                for (let j = s+1; j <= end; j++) mainCtx.lineTo(pts[j][0], pts[j][1]);
                mainCtx.stroke();
            }
        }
    }

    mainCtx.shadowBlur = 0;

    // Animate node canvas ring pulse in edit mode
    if (state.nodeEditMode) {
        nodeAnimPhase += 0.03;
        updateNodeCanvas();
    }
}

draw();
</script>
</body>
</html>
