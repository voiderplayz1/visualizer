<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lissajous</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400&display=swap');

:root {
    --accent: #000000;
    --bg: #ffffff;
    --border: rgba(0,0,0,0.13);
    --border-mid: rgba(0,0,0,0.28);
    --panel-bg: rgba(255,255,255,0.92);
    --text-muted: rgba(0,0,0,0.7);
    --text-dim: rgba(0,0,0,0.42);
    --font: 'EB Garamond', Georgia, 'Times New Roman', serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: var(--bg);
    color: var(--accent);
    font-family: var(--font);
    height: 100vh;
    overflow: hidden;
}

canvas { display: block; }

/* Layer stack */
#gl-canvas   { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; }
#node-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }

/* Hamburger */
#hamburger {
    position: fixed; top: 14px; left: 14px; z-index: 999;
    width: 34px; height: 34px;
    background: rgba(255,255,255,0.85); backdrop-filter: blur(16px);
    border: 1px solid var(--border); border-radius: 4px;
    cursor: pointer; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 5px;
    transition: border-color 0.2s, background 0.2s;
}
#hamburger:hover { border-color: var(--border-mid); }
#hamburger span { display: block; width: 14px; height: 1px; background: var(--text-muted); transition: background 0.2s; }
#hamburger:hover span { background: #000; }

/* Panel */
.panel {
    position: fixed;
    background: var(--panel-bg);
    backdrop-filter: blur(32px) saturate(1.2);
    border: 1px solid var(--border);
    border-radius: 4px;
    z-index: 100;
    box-shadow: 0 8px 40px rgba(0,0,0,0.10);
    transition: transform 0.45s cubic-bezier(0.4,0,0.2,1), opacity 0.35s ease;
    overflow: hidden;
}
#controls { top: 14px; left: 58px; width: 260px; }
#controls.hidden { transform: translateX(calc(-100% - 80px)); opacity: 0; pointer-events: none; }

.panel-header {
    padding: 12px 16px 10px;
    border-bottom: 1px solid rgba(0,0,0,0.07);
    display: flex; align-items: center; gap: 8px;
    cursor: grab; user-select: none;
}
.panel-header:active { cursor: grabbing; }
.panel-title { font-size: 0.78rem; letter-spacing: 5px; text-transform: uppercase; color: var(--text-dim); flex: 1; }

.panel-body {
    max-height: calc(100vh - 80px);
    overflow-y: auto;
}
/* Scrollbar styling */
.panel-body::-webkit-scrollbar { width: 5px; }
.panel-body::-webkit-scrollbar-track { background: transparent; }
.panel-body::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 5px; }

.panel-section {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    display: flex; flex-direction: column; gap: 10px;
}
.panel-section:last-child { border-bottom: none; padding-bottom: 16px; }

.section-label {
    font-size: 0.72rem; letter-spacing: 4px; text-transform: uppercase;
    color: var(--text-dim); font-style: italic;
}

.btn {
    width: 100%; padding: 9px 14px;
    border: 1px solid var(--border); border-radius: 60px;
    background: rgba(0,0,0,0.03); color: var(--text-muted);
    font-family: var(--font); font-size: 0.88rem;
    letter-spacing: 3px; text-transform: uppercase;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: border-color 0.2s, background 0.2s, color 0.2s;
}
.btn:hover { border-color: var(--border-mid); background: rgba(0,0,0,0.07); color: #000; }
.btn-square { border-radius: 4px; }

.btn-record { border-color: rgba(200,50,40,0.22); color: rgba(180,60,50,0.75); background: rgba(200,50,40,0.04); }
.btn-record:hover { border-color: rgba(200,50,40,0.45); color: rgba(180,50,40,1); background: rgba(200,50,40,0.09); }
.btn-record.recording { border-color: rgba(200,50,40,0.55); color: rgba(180,50,40,1); background: rgba(200,50,40,0.12); animation: pulse-rec 1.5s ease-in-out infinite; }
@keyframes pulse-rec { 0%,100%{box-shadow:0 0 0 0 rgba(200,50,40,0);}50%{box-shadow:0 0 0 4px rgba(200,50,40,0.1);} }

.btn-capture { border-color: rgba(0,100,220,0.2); color: rgba(0,80,200,0.7); background: rgba(0,100,220,0.04); }
.btn-capture:hover { border-color: rgba(0,100,220,0.4); color: rgba(0,80,200,1); background: rgba(0,100,220,0.09); }
.btn-capture.active { border-color: rgba(200,50,40,0.45); color: rgba(180,50,40,1); background: rgba(200,50,40,0.09); animation: pulse-cap 2s ease-in-out infinite; }
@keyframes pulse-cap { 0%,100%{box-shadow:0 0 0 0 rgba(200,50,40,0);}50%{box-shadow:0 0 0 4px rgba(200,50,40,0.1);} }

.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.btn-record.recording .dot,
.btn-capture.active .dot { animation: blink 1.1s step-start infinite; }
@keyframes blink { 0%,100%{opacity:1}50%{opacity:0.1} }

.btn-toggle-on  { border-color: rgba(0,0,0,0.22); color: rgba(0,0,0,0.75); background: rgba(0,0,0,0.05); }
.btn-toggle-off { border-color: rgba(0,0,0,0.1);  color: rgba(0,0,0,0.32);  background: rgba(0,0,0,0.02); }

.btn-version { border-color: rgba(80,0,180,0.2); color: rgba(80,0,180,0.7); background: rgba(80,0,180,0.04); }
.btn-version:hover { border-color: rgba(80,0,180,0.4); color: rgba(80,0,180,1); background: rgba(80,0,180,0.09); }
.btn-version.legacy { border-color: rgba(180,80,0,0.3); color: rgba(160,70,0,0.8); background: rgba(180,80,0,0.05); }

.btn-nodes-edit { border-color: rgba(0,150,100,0.25); color: rgba(0,130,85,0.8); background: rgba(0,150,100,0.04); }
.btn-nodes-edit:hover { border-color: rgba(0,150,100,0.45); color: rgba(0,120,80,1); background: rgba(0,150,100,0.09); }
.btn-nodes-edit.active { border-color: rgba(0,150,100,0.55); color: rgba(0,120,80,1); background: rgba(0,150,100,0.12); animation: pulse-node 2s ease-in-out infinite; }
@keyframes pulse-node { 0%,100%{box-shadow:0 0 0 0 rgba(0,150,100,0);}50%{box-shadow:0 0 0 4px rgba(0,150,100,0.12);} }

.btn-add-node { border-color: rgba(0,150,100,0.2); color: rgba(0,130,85,0.7); background: rgba(0,150,100,0.03); }
.btn-add-node:hover { border-color: rgba(0,150,100,0.4); color: rgba(0,120,80,1); background: rgba(0,150,100,0.08); }
.btn-add-node:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-add-node:disabled:hover { border-color: rgba(0,150,100,0.2); color: rgba(0,130,85,0.7); background: rgba(0,150,100,0.03); }

.ctrl-row { display: flex; flex-direction: column; gap: 5px; }
.ctrl-label {
    font-size: 0.85rem; letter-spacing: 1.5px; text-transform: uppercase;
    color: #000; display: flex; justify-content: space-between;
}
.ctrl-val { color: #000; opacity: 0.55; font-variant-numeric: tabular-nums; letter-spacing: 0; font-style: italic; }

input[type="range"] {
    width: 100%; height: 1px; appearance: none; -webkit-appearance: none;
    background: rgba(0,0,0,0.18); border-radius: 1px; outline: none; cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 9px; height: 9px; border-radius: 50%;
    background: #000; box-shadow: 0 0 8px rgba(0,0,0,0.35); cursor: pointer;
}
input[type="range"]::-moz-range-thumb {
    width: 9px; height: 9px; border-radius: 50%; border: none;
    background: #000; box-shadow: 0 0 8px rgba(0,0,0,0.35);
}

.color-row { display: flex; flex-direction: column; gap: 5px; }
input[type="color"] {
    width: 100%; height: 30px; background: rgba(0,0,0,0.03);
    border: 1px solid var(--border); border-radius: 3px;
    cursor: pointer; padding: 3px 6px; transition: border-color 0.2s;
}
input[type="color"]:hover { border-color: var(--border-mid); }

.ctrl-row-sm { display: flex; flex-direction: column; gap: 4px; }
.tip { font-size: 0.78rem; letter-spacing: 0.2px; color: var(--text-dim); line-height: 1.6; font-style: italic; }

.node-list { display: flex; flex-direction: column; gap: 6px; }
.node-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 4px;
    background: rgba(0,0,0,0.025); border: 1px solid var(--border);
    font-size: 0.82rem; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text-muted);
}
.node-swatch { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.12); }
.node-label { flex: 1; }
.node-remove {
    width: 18px; height: 18px; border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.12); background: transparent;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--text-dim); line-height: 1;
    transition: border-color 0.15s, color 0.15s, background 0.15s; flex-shrink: 0;
}
.node-remove:hover { border-color: rgba(200,50,40,0.4); color: rgba(200,50,40,0.85); background: rgba(200,50,40,0.06); }

#node-color-overlay {
    position: fixed; inset: 0; z-index: 500;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.18); backdrop-filter: blur(4px);
}
#node-color-overlay.visible { display: flex; }
#node-color-box {
    background: var(--panel-bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 22px 24px;
    box-shadow: 0 12px 48px rgba(0,0,0,0.18);
    display: flex; flex-direction: column; gap: 16px; min-width: 220px;
}
#node-color-box h3 { font-size: 0.78rem; letter-spacing: 5px; text-transform: uppercase; color: var(--text-dim); font-weight: 400; }
#node-color-box input[type="color"] { width: 100%; height: 44px; }
.node-overlay-btns { display: flex; gap: 8px; }
.node-overlay-btns .btn { font-size: 0.8rem; padding: 7px 10px; letter-spacing: 2px; }
</style>
</head>
<body>

<canvas id="gl-canvas"></canvas>
<canvas id="node-canvas"></canvas>

<button id="hamburger" title="Toggle panel">
    <span></span><span></span><span></span>
</button>

<div id="node-color-overlay">
    <div id="node-color-box">
        <h3>Node Color</h3>
        <input type="color" id="new-node-color-input" value="#ff4400">
        <div class="node-overlay-btns">
            <button class="btn btn-square" id="node-color-cancel" style="flex:1">Cancel</button>
            <button class="btn btn-square btn-add-node" id="node-color-confirm" style="flex:1">Place ↓</button>
        </div>
    </div>
</div>

<div id="controls" class="panel">
    <div class="panel-header" id="controls-handle">
        <span class="panel-title"></span>
    </div>
    
    <div class="panel-body">
        <div class="panel-section">
            <span class="section-label">Source</span>
            <button id="btn-record" class="btn btn-record"><span class="dot"></span>Record video</button>
            <div class="ctrl-row-sm">
                <label class="ctrl-label"><span>Resolution</span><span class="ctrl-val" id="val-rec-res">1280 × 720</span></label>
                <input type="range" id="rec-res" min="0" max="3" step="1" value="1">
            </div>
            <div class="ctrl-row-sm">
                <label class="ctrl-label"><span>Frame rate</span><span class="ctrl-val" id="val-rec-fps">60 fps</span></label>
                <input type="range" id="rec-fps" min="24" max="120" step="1" value="60">
            </div>
            <button id="btn-capture" class="btn btn-capture"><span class="dot"></span>Capture app / tab</button>
            <p class="tip">Tick "Share audio" in the browser picker.</p>
        </div>

        <div class="panel-section">
            <span class="section-label">Colors</span>
            <div class="color-row">
                <span class="ctrl-label">Background</span>
                <input type="color" id="bg-color-picker" value="#ffffff">
            </div>
            <div class="color-row">
                <span class="ctrl-label">Base line color</span>
                <input type="color" id="color-picker" value="#000000">
            </div>
        </div>

        <div class="panel-section">
            <span class="section-label">Shape</span>
            <div class="ctrl-row">
                <label class="ctrl-label"><span>Density</span><span class="ctrl-val" id="val-liss-density">15</span></label>
                <input type="range" id="fx-liss-density" min="1" max="1500" step="1" value="15">
            </div>
            <div class="ctrl-row">
                <label class="ctrl-label"><span>Spread</span><span class="ctrl-val" id="val-liss-spread">1.00</span></label>
                <input type="range" id="fx-liss-spread" min="0.1" max="2.0" step="0.01" value="1.0">
            </div>
            <div class="ctrl-row">
                <label class="ctrl-label"><span>Thickness</span><span class="ctrl-val" id="val-thickness">0.50</span></label>
                <input type="range" id="fx-thickness" min="0.1" max="5.0" step="0.01" value="0.5">
            </div>


        </div>

        <div class="panel-section">
            <span class="section-label">Color Nodes</span>
            <div class="ctrl-row-sm">
                <label class="ctrl-label"><span>Influence radius</span><span class="ctrl-val" id="val-node-radius">280</span></label>
                <input type="range" id="fx-node-radius" min="40" max="1000" step="1" value="280">
            </div>
            <div class="ctrl-row-sm">
                <label class="ctrl-label"><span>Node Glow</span><span class="ctrl-val" id="val-node-glow">1.00</span></label>
                <input type="range" id="fx-node-glow" min="0.0" max="5.0" step="0.01" value="1.00">
            </div>
            <div style="display:flex;gap:8px;align-items:center;margin-top:4px;">
                <button id="btn-nodes-edit" class="btn btn-square btn-nodes-edit" style="flex:1">Edit Nodes</button>
                <button id="btn-add-node" class="btn btn-square btn-add-node" style="flex:1" disabled>+ Add Node</button>
            </div>
            <div id="node-list" class="node-list"></div>
            <p class="tip" id="node-tip" style="display:none">Click node to delete · drag to move</p>
        </div>

        <div class="panel-section">
            <span class="section-label">Version</span>
            <button id="btn-version" class="btn btn-version">Switch to Legacy ↻</button>
        </div>
    </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// CANVAS SETUP
// Two completely separate rendering layers:
//   gl-canvas  — WebGL, runs every frame, draws Lissajous curve on GPU
//   node-canvas — 2D, only redraws when node state changes (not every frame)
// ─────────────────────────────────────────────────────────────────────────────
const glCanvas   = document.getElementById('gl-canvas');
const nodeCanvas = document.getElementById('node-canvas');
const nodeCtx    = nodeCanvas.getContext('2d');

// ─── WebGL setup ─────────────────────────────────────────────────────────────
const gl = glCanvas.getContext('webgl', { antialias: true, premultipliedAlpha: false, alpha: false });
if (!gl) { document.body.innerHTML = '<p style="padding:2em">WebGL not supported</p>'; throw 0; }

// ─── Shaders ─────────────────────────────────────────────────────────────────
// Vertex shader: takes 1D index, computes Lissajous x/y, passes world-space
// position + neighbours to fragment shader for thickness.
//
// We draw the curve as a triangle strip of quads (each segment = 2 triangles),
// so each vertex knows its position AND the perpendicular direction → proper
// thick line without Canvas2D overhead.

const VS_CURVE = `
precision highp float;

attribute float a_index;      // 0..N-1 segment index
uniform float u_total;        // total number of segments
uniform sampler2D u_audio;    // audio waveform [0..1] packed as 1D texture

uniform float u_offset;       // sample offset for Y channel (lissajous offset)
uniform float u_scl;          // xy scale
uniform float u_rotation;     // rotation angle (radians)
uniform float u_thickness;    // line half-width in clip space
uniform float u_aspect;       // width/height for thickness correction
uniform float u_legacy;       // 0 = catmull-rom, 1 = linear (legacy mode)

varying float v_t;            // normalized position along curve [0..1]
varying float v_side;         // -1 or +1 (which edge of the strip)

// Catmull-Rom
float catmull(float p0, float p1, float p2, float p3, float t) {
    return 0.5 * ((2.0*p1) + (-p0+p2)*t + (2.0*p0-5.0*p1+4.0*p2-p3)*t*t + (-p0+3.0*p1-3.0*p2+p3)*t*t*t);
}

// sample waveform texture at normalised position s in [0,1]
float sampleAudio(float s) {
    return texture2D(u_audio, vec2(s, 0.5)).r * 2.0 - 1.0;
}

// Lissajous position at normalised t [0,1]
vec2 lissPos(float t) {
    float len = u_total;           // segments ≈ sample count
    float idx = t * len;

    vec2 pos;
    if (u_legacy > 0.5) {
        // Legacy: linear samples
        float nx = sampleAudio(fract(idx / len));
        float ny = sampleAudio(fract((idx + u_offset) / len));
        pos = vec2(nx, ny);
    } else {
        // V2: catmull-rom upsampled
        float fi  = floor(idx);
        float tt  = idx - fi;
        float n   = len;
        float s0  = fract((fi - 1.0) / n);
        float s1  = fract( fi        / n);
        float s2  = fract((fi + 1.0) / n);
        float s3  = fract((fi + 2.0) / n);
        float ox0 = fract((fi - 1.0 + u_offset) / n);
        float ox1 = fract((fi        + u_offset) / n);
        float ox2 = fract((fi + 1.0 + u_offset) / n);
        float ox3 = fract((fi + 2.0 + u_offset) / n);
        float nx  = catmull(sampleAudio(s0),sampleAudio(s1),sampleAudio(s2),sampleAudio(s3), tt);
        float ny  = catmull(sampleAudio(ox0),sampleAudio(ox1),sampleAudio(ox2),sampleAudio(ox3), tt);
        pos = vec2(nx, ny);
    }

    // scale + rotate
    float rx = pos.x * u_scl;
    float ry = pos.y * u_scl;
    float cosR = cos(u_rotation);
    float sinR = sin(u_rotation);
    return vec2(rx*cosR - ry*sinR, rx*sinR + ry*cosR);
}

void main() {
    // Each "segment" needs two vertices (strip side)
    // a_index encodes: floor = segment, fract = side (0 = left, 0.5 = right)
    float segF  = floor(a_index);
    float side  = (fract(a_index) > 0.25) ? 1.0 : -1.0;
    v_side = side;

    float t0 = segF        / u_total;
    float t1 = (segF + 1.0)/ u_total;
    v_t = t0;

    vec2 p0 = lissPos(t0);
    vec2 p1 = lissPos(t1);

    // Tangent direction
    vec2 dir  = p1 - p0;
    float len = length(dir);
    vec2 tang = (len > 0.0001) ? dir / len : vec2(1.0, 0.0);
    vec2 perp = vec2(-tang.y, tang.x);

    // Extrude perpendicular for thick line
    vec2 pos = p0 + perp * side * u_thickness;

    // Convert to clip space (Y already correct, account for aspect)
    gl_Position = vec4(pos.x, pos.y * u_aspect, 0.0, 1.0);
}
`;

// Fragment shader: samples node influence entirely on GPU.
// Up to MAX_NODES colour nodes with positions/radii stored as uniforms.
const MAX_NODES = 5;
const FS_CURVE = `
precision highp float;

#define MAX_NODES ${MAX_NODES}

varying float v_t;
varying float v_side;

uniform vec3  u_baseColor;
uniform float u_nodeCount;
uniform vec2  u_nodePos[MAX_NODES];    // screen space [0..1]^2
uniform vec3  u_nodeColor[MAX_NODES];
uniform float u_nodeRadius;            // in [0..1] screen-space radius (normalised)
uniform float u_aspect;

void main() {
    float edgeFade = 1.0 - abs(v_side);
    float alpha = pow(edgeFade, 1.5);
    gl_FragColor = vec4(u_baseColor * alpha, alpha);
}
`;

// Second pass: full-screen quad that applies node color influence.
// Reads the curve from a texture, samples node distances in screen space.
// This is where the actual colour blending happens — fully on the GPU,
// zero JavaScript per pixel.
const VS_FULLSCREEN = `
attribute vec2 a_pos;
varying vec2 v_uv;
void main() { v_uv = a_pos * 0.5 + 0.5; gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

const FS_FULLSCREEN = `
precision highp float;
#define MAX_NODES ${MAX_NODES}

uniform sampler2D u_curve;    // rendered curve
uniform sampler2D u_bg;       // background (single pixel, cleared to bg color)
uniform vec2  u_resolution;
uniform vec3  u_baseColor;
uniform float u_nodeCount;
uniform vec2  u_nodePos[MAX_NODES];
uniform vec3  u_nodeColor[MAX_NODES];
uniform float u_nodeRadius;
uniform float u_nodeGlow;

varying vec2 v_uv;

void main() {
    vec2 uv    = v_uv;
    vec4 curve = texture2D(u_curve, uv);
    vec3 bg    = texture2D(u_bg, vec2(0.5)).rgb;

    // Node influence
    float totalW = 0.0;
    vec3  nodeMix = vec3(0.0);
    for (int i = 0; i < MAX_NODES; i++) {
        if (float(i) >= u_nodeCount) break;
        vec2  diff = uv - u_nodePos[i];
        diff.x *= u_resolution.x / u_resolution.y;
        float dist = length(diff);
        float nr   = u_nodeRadius;
        if (dist < nr) {
            float t = 1.0 - dist / nr;
            float w = t * t;
            nodeMix += u_nodeColor[i] * w;
            totalW  += w;
        }
    }

    vec3 lineColor = u_baseColor;
    if (totalW > 0.001) {
        lineColor = mix(u_baseColor, nodeMix / totalW, min(1.0, totalW * 1.4));
    }

    vec3 final = mix(bg, lineColor, curve.a);

    // Node emissive
    if (totalW > 0.001) {
        final += (nodeMix / totalW) * min(1.0, totalW) * u_nodeGlow * 0.5;
    }

    gl_FragColor = vec4(min(final, vec3(1.0)), 1.0);
}
`;

// ─── Shader compilation ───────────────────────────────────────────────────────
function compileShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
        throw new Error('Shader error: ' + gl.getShaderInfoLog(s));
    return s;
}
function linkProgram(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, vs); gl.attachShader(p, fs);
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS))
        throw new Error('Program error: ' + gl.getProgramInfoLog(p));
    return p;
}

const curveProg = linkProgram(
    compileShader(gl.VERTEX_SHADER,   VS_CURVE),
    compileShader(gl.FRAGMENT_SHADER, FS_CURVE)
);
const screenProg = linkProgram(
    compileShader(gl.VERTEX_SHADER,   VS_FULLSCREEN),
    compileShader(gl.FRAGMENT_SHADER, FS_FULLSCREEN)
);

// ─── Curve geometry (triangle strip) ─────────────────────────────────────────
// N segments → N+1 vertices on each side → 2*(N+1) indices in strip
// Encode as float: int part = segment index, fract = side
const CURVE_SEGS = 1024;
function buildCurveBuffer(segs) {
    const verts = [];
    for (let i = 0; i <= segs; i++) {
        // left side (side bit = 0 → -1)
        verts.push(i + 0.0);
        // right side (side bit = 0.5 → +1)
        verts.push(i + 0.5);
    }
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);
    return buf;
}
const curveBuf    = buildCurveBuffer(CURVE_SEGS);
const curveVCount = 2 * (CURVE_SEGS + 1);


const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER,
    new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

// ─── Framebuffer for curve pass ───────────────────────────────────────────────
let fbo, fboTex;
function createFBO(w, h) {
    if (fboTex) gl.deleteTexture(fboTex);
    if (fbo)    gl.deleteFramebuffer(fbo);
    fboTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, fboTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fboTex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

// ─── 1×1 background colour texture ───────────────────────────────────────────
const bgTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, bgTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

function updateBgTex(r, g, b) {
    gl.bindTexture(gl.TEXTURE_2D, bgTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, 1, 1, 0, gl.RGB, gl.UNSIGNED_BYTE,
        new Uint8Array([r, g, b]));
}
updateBgTex(255, 255, 255);

// ─── Audio waveform texture (1024 × 1 LUMINANCE) ─────────────────────────────
const audioTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, audioTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
// Init to silence (128 = 0.5 normalised)
gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, 1024, 1, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE,
    new Uint8Array(1024).fill(128));

const audioData = new Uint8Array(1024);

// ─── State ────────────────────────────────────────────────────────────────────
const state = {
    mode: 'lissajous',
    color: '#000000',
    bgColor: '#ffffff',
    thickness: 0.5,
    lissOffset: 15,
    lissSpread: 1.0,
    rotationEnabled: false,
    nodeEditMode: false,
    nodeRadius: 280,
    nodeGlow: 1.0,
    nodes: [],
};
let drawPhase = 0;

// ─── Audio ────────────────────────────────────────────────────────────────────
let audioCtx, analyser, preAnalyser;
let captureStream = null, captureSource = null;
let mediaRecorder = null, recordChunks = [], isRecording = false;
let animId = null;

function initAudioGraph() {
    if (audioCtx) return;
    audioCtx   = new (window.AudioContext || window.webkitAudioContext)();
    preAnalyser = audioCtx.createAnalyser(); preAnalyser.fftSize = 2048; preAnalyser.smoothingTimeConstant = 0.5;
    analyser    = audioCtx.createAnalyser(); analyser.fftSize    = 2048; analyser.smoothingTimeConstant    = 0.5;
    const vol = audioCtx.createGain(); vol.gain.value = 1;
    preAnalyser.connect(vol); vol.connect(analyser);
}
function connectSource(node) { node.connect(preAnalyser); }

// ─── Resize ───────────────────────────────────────────────────────────────────
function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    glCanvas.width   = w; glCanvas.height   = h;
    nodeCanvas.width = w; nodeCanvas.height = h;
    gl.viewport(0, 0, w, h);
    createFBO(w, h);
}
window.addEventListener('resize', resize); resize();

// ─── Helpers ──────────────────────────────────────────────────────────────────
function hexToRgb(hex) {
    return { r: parseInt(hex.slice(1,3),16), g: parseInt(hex.slice(3,5),16), b: parseInt(hex.slice(5,7),16) };
}
function hexToRgbNorm(hex) {
    const c = hexToRgb(hex);
    return [c.r/255, c.g/255, c.b/255];
}
function getUnif(prog, name) { return gl.getUniformLocation(prog, name); }
function getAttr(prog, name) { return gl.getAttribLocation(prog, name); }

// Pre-fetch locations
const curveLocs = {
    a_index:     getAttr(curveProg, 'a_index'),
    u_total:     getUnif(curveProg, 'u_total'),
    u_audio:     getUnif(curveProg, 'u_audio'),
    u_offset:    getUnif(curveProg, 'u_offset'),
    u_scl:       getUnif(curveProg, 'u_scl'),
    u_rotation:  getUnif(curveProg, 'u_rotation'),
    u_thickness: getUnif(curveProg, 'u_thickness'),
    u_aspect:    getUnif(curveProg, 'u_aspect'),
    u_legacy:    getUnif(curveProg, 'u_legacy'),
    u_baseColor: getUnif(curveProg, 'u_baseColor'),
    u_nodeCount: getUnif(curveProg, 'u_nodeCount'),
    u_nodePos:   getUnif(curveProg, 'u_nodePos'),
    u_nodeColor: getUnif(curveProg, 'u_nodeColor'),
    u_nodeRadius:getUnif(curveProg, 'u_nodeRadius'),
};
const screenLocs = {
    a_pos:       getAttr(screenProg, 'a_pos'),
    u_curve:     getUnif(screenProg, 'u_curve'),
    u_bg:        getUnif(screenProg, 'u_bg'),
    u_resolution:getUnif(screenProg, 'u_resolution'),
    u_baseColor: getUnif(screenProg, 'u_baseColor'),
    u_nodeCount: getUnif(screenProg, 'u_nodeCount'),
    u_nodePos:   getUnif(screenProg, 'u_nodePos'),
    u_nodeColor: getUnif(screenProg, 'u_nodeColor'),
    u_nodeRadius:getUnif(screenProg, 'u_nodeRadius'),
    u_nodeGlow:  getUnif(screenProg, 'u_nodeGlow'),
};

// ─── Main render loop ─────────────────────────────────────────────────────────
function draw() {
    animId = requestAnimationFrame(draw);

    

    const w = glCanvas.width, h = glCanvas.height;

    // Upload audio waveform — DC offset removed so center stays locked
    if (preAnalyser) {
        preAnalyser.getByteTimeDomainData(audioData);
        // Compute mean and subtract so the curve centroid is always 0,0
        let sum = 0;
        for (let i = 0; i < audioData.length; i++) sum += audioData[i];
        const mean = sum / audioData.length;
        for (let i = 0; i < audioData.length; i++) {
            audioData[i] = Math.max(0, Math.min(255, Math.round(audioData[i] - mean + 128)));
        }
    }
    gl.bindTexture(gl.TEXTURE_2D, audioTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, 1024, 1, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, audioData);

    const baseColor = hexToRgbNorm(state.color);
    const bg        = hexToRgb(state.bgColor);
    updateBgTex(bg.r, bg.g, bg.b);

    // Build node uniforms (flat arrays for WebGL)
    const nodeCount = state.nodes.length;
    const nodePosArr   = new Float32Array(MAX_NODES * 2);
    const nodeColorArr = new Float32Array(MAX_NODES * 3);
    for (let i = 0; i < nodeCount; i++) {
        const nd = state.nodes[i];
        nodePosArr[i*2]     = nd.x / w;
        nodePosArr[i*2 + 1] = 1.0 - nd.y / h; // flip Y for WebGL UV
        nodeColorArr[i*3]   = nd.r / 255;
        nodeColorArr[i*3+1] = nd.g / 255;
        nodeColorArr[i*3+2] = nd.b / 255;
    }
    // Normalised radius (relative to width)
    const nodeRadNorm = state.nodeRadius / w;

    const scl      = 0.45 * state.lissSpread;
    const aspect   = w / h;
    const legacyF  = state.mode === 'legacy' ? 1.0 : 0.0;
    // Thickness in clip space (approximate: 1px ≈ 2/w in clip)
    const thickClip = (state.thickness * 2.5) / w;

    // ── Pass 1: render curve into FBO ────────────────────────────────────────
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE); // additive for glow

    gl.useProgram(curveProg);
    gl.bindBuffer(gl.ARRAY_BUFFER, curveBuf);
    gl.enableVertexAttribArray(curveLocs.a_index);
    gl.vertexAttribPointer(curveLocs.a_index, 1, gl.FLOAT, false, 0, 0);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, audioTex);
    gl.uniform1i(curveLocs.u_audio, 0);

    gl.uniform1f(curveLocs.u_total,      CURVE_SEGS);
    gl.uniform1f(curveLocs.u_offset,     state.lissOffset);
    gl.uniform1f(curveLocs.u_scl,        scl);
    gl.uniform1f(curveLocs.u_rotation,   drawPhase * 0.05);
    gl.uniform1f(curveLocs.u_thickness,  thickClip);
    gl.uniform1f(curveLocs.u_aspect,     aspect);
    gl.uniform1f(curveLocs.u_legacy,     legacyF);
    gl.uniform3fv(curveLocs.u_baseColor, baseColor);
    gl.uniform1f(curveLocs.u_nodeCount,  nodeCount);
    gl.uniform2fv(curveLocs.u_nodePos,   nodePosArr);
    gl.uniform3fv(curveLocs.u_nodeColor, nodeColorArr);
    gl.uniform1f(curveLocs.u_nodeRadius, nodeRadNorm);

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, curveVCount);

    // ── Pass 2: composite onto screen with node colour influence ─────────────
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, w, h);
    gl.disable(gl.BLEND);
    gl.clearColor(bg.r/255, bg.g/255, bg.b/255, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.useProgram(screenProg);
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.enableVertexAttribArray(screenLocs.a_pos);
    gl.vertexAttribPointer(screenLocs.a_pos, 2, gl.FLOAT, false, 0, 0);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, fboTex);
    gl.uniform1i(screenLocs.u_curve, 0);

    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, bgTex);
    gl.uniform1i(screenLocs.u_bg, 1);

    gl.uniform2f(screenLocs.u_resolution, w, h);
    gl.uniform3fv(screenLocs.u_baseColor,  baseColor);
    gl.uniform1f(screenLocs.u_nodeCount,   nodeCount);
    gl.uniform2fv(screenLocs.u_nodePos,    nodePosArr);
    gl.uniform3fv(screenLocs.u_nodeColor,  nodeColorArr);
    gl.uniform1f(screenLocs.u_nodeRadius,  nodeRadNorm);
    gl.uniform1f(screenLocs.u_nodeGlow,    state.nodeGlow);

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

draw();

// ─────────────────────────────────────────────────────────────────────────────
// NODE OVERLAY — 2D canvas, redraws only when state changes
// No longer runs inside the render loop at all.
// ─────────────────────────────────────────────────────────────────────────────
let nodeHovering = -1;
let nodeDirty    = false;

function drawNodeOverlay() {
    nodeDirty = false;
    nodeCtx.clearRect(0, 0, nodeCanvas.width, nodeCanvas.height);
    if (!state.nodeEditMode || state.nodes.length === 0) return;

    const w = nodeCanvas.width;

    state.nodes.forEach((nd, i) => {
        const isHover = i === nodeHovering;
        const rad = state.nodeRadius;

        // Influence ring
        nodeCtx.save();
        const gr = nodeCtx.createRadialGradient(nd.x, nd.y, 0, nd.x, nd.y, rad);
        let alphaBase = 0.08 * (1.0 + state.nodeGlow * 0.2); // Pulse opacity based on node glow setting
        gr.addColorStop(0,   `rgba(${nd.r},${nd.g},${nd.b},${alphaBase})`);
        gr.addColorStop(0.7, `rgba(${nd.r},${nd.g},${nd.b},${alphaBase * 0.5})`);
        gr.addColorStop(1,   `rgba(${nd.r},${nd.g},${nd.b},0.0)`);
        nodeCtx.beginPath();
        nodeCtx.arc(nd.x, nd.y, rad, 0, Math.PI * 2);
        nodeCtx.fillStyle = gr;
        nodeCtx.fill();

        // Dashed ring
        nodeCtx.beginPath();
        nodeCtx.arc(nd.x, nd.y, rad, 0, Math.PI * 2);
        nodeCtx.setLineDash([6, 5]);
        nodeCtx.strokeStyle = `rgba(${nd.r},${nd.g},${nd.b},${isHover ? 0.55 : 0.28})`;
        nodeCtx.lineWidth = 1;
        nodeCtx.stroke();
        nodeCtx.setLineDash([]);

        // Node circle
        const nodeR = isHover ? 11 : 9;

        // Halo
        nodeCtx.beginPath();
        nodeCtx.arc(nd.x, nd.y, nodeR + 4, 0, Math.PI * 2);
        nodeCtx.fillStyle = `rgba(${nd.r},${nd.g},${nd.b},${isHover ? 0.18 : 0.08})`;
        nodeCtx.fill();

        // Main dot
        nodeCtx.beginPath();
        nodeCtx.arc(nd.x, nd.y, nodeR, 0, Math.PI * 2);
        nodeCtx.fillStyle = nd.color;
        nodeCtx.fill();

        // White centre
        nodeCtx.beginPath();
        nodeCtx.arc(nd.x, nd.y, 5, 0, Math.PI * 2);
        nodeCtx.fillStyle = 'rgba(255,255,255,0.85)';
        nodeCtx.fill();

        // Delete hint on hover
        if (isHover) {
            nodeCtx.fillStyle = 'rgba(200,60,40,0.85)';
            nodeCtx.font = 'bold 8px sans-serif';
            nodeCtx.textAlign = 'center';
            nodeCtx.textBaseline = 'middle';
            nodeCtx.fillText('✕', nd.x, nd.y);
        }

        // Label
        nodeCtx.font = '500 11px "EB Garamond", Georgia, serif';
        nodeCtx.textAlign = 'center';
        nodeCtx.textBaseline = 'top';
        nodeCtx.fillStyle = `rgba(${nd.r},${nd.g},${nd.b},0.9)`;
        nodeCtx.fillText(nd.label, nd.x, nd.y + nodeR + 6);

        nodeCtx.restore();
    });
}

function markNodeDirty() {
    if (!nodeDirty) { nodeDirty = true; requestAnimationFrame(drawNodeOverlay); }
}

// ─── Node interaction ─────────────────────────────────────────────────────────
nodeCanvas.style.pointerEvents = state.nodeEditMode ? 'auto' : 'none';
const NODE_HIT_R      = 22;
const DRAG_THRESHOLD  = 6;
let nodePointerDown   = null;
let nodeDragging      = null;

function getNodeAt(x, y) {
    for (let i = state.nodes.length - 1; i >= 0; i--) {
        const d = state.nodes[i];
        if (Math.hypot(d.x - x, d.y - y) <= NODE_HIT_R) return i;
    }
    return -1;
}

nodeCanvas.addEventListener('mousedown', e => {
    if (!state.nodeEditMode) return;
    const idx = getNodeAt(e.clientX, e.clientY);
    if (idx < 0) return;
    e.preventDefault();
    nodePointerDown = { index: idx, x: e.clientX, y: e.clientY };
    nodeDragging    = null;
});
window.addEventListener('mousemove', e => {
    if (!state.nodeEditMode) return;
    const hov = getNodeAt(e.clientX, e.clientY);
    if (hov !== nodeHovering) {
        nodeHovering = hov;
        nodeCanvas.style.cursor = hov >= 0 ? 'grab' : 'default';
        markNodeDirty();
    }
    if (!nodePointerDown) return;
    const dx = e.clientX - nodePointerDown.x, dy = e.clientY - nodePointerDown.y;
    if (!nodeDragging && Math.hypot(dx, dy) > DRAG_THRESHOLD) {
        nodeDragging = { index: nodePointerDown.index };
        nodeCanvas.style.cursor = 'grabbing';
    }
    if (nodeDragging) {
        const nd = state.nodes[nodeDragging.index];
        nd.x = Math.max(0, Math.min(nodeCanvas.width,  e.clientX));
        nd.y = Math.max(0, Math.min(nodeCanvas.height, e.clientY));
        markNodeDirty();
    }
});
window.addEventListener('mouseup', e => {
    if (!state.nodeEditMode) { nodePointerDown = null; nodeDragging = null; return; }
    if (nodePointerDown && !nodeDragging) {
        const idx = getNodeAt(e.clientX, e.clientY);
        if (idx >= 0 && idx === nodePointerDown.index) removeNode(idx);
    }
    nodePointerDown = null; nodeDragging = null;
    if (state.nodeEditMode) nodeCanvas.style.cursor = nodeHovering >= 0 ? 'grab' : 'default';
});

// Touch
nodeCanvas.addEventListener('touchstart', e => {
    if (!state.nodeEditMode) return;
    const t = e.touches[0];
    const idx = getNodeAt(t.clientX, t.clientY);
    if (idx < 0) return;
    e.preventDefault();
    nodePointerDown = { index: idx, x: t.clientX, y: t.clientY };
}, { passive: false });
window.addEventListener('touchmove', e => {
    if (!state.nodeEditMode || !nodePointerDown) return;
    e.preventDefault();
    const t = e.touches[0];
    if (!nodeDragging && Math.hypot(t.clientX - nodePointerDown.x, t.clientY - nodePointerDown.y) > DRAG_THRESHOLD)
        nodeDragging = { index: nodePointerDown.index };
    if (nodeDragging) {
        const nd = state.nodes[nodeDragging.index];
        nd.x = Math.max(0, Math.min(nodeCanvas.width,  t.clientX));
        nd.y = Math.max(0, Math.min(nodeCanvas.height, t.clientY));
        markNodeDirty();
    }
}, { passive: false });
window.addEventListener('touchend', e => {
    if (!state.nodeEditMode) { nodePointerDown = null; nodeDragging = null; return; }
    if (nodePointerDown && !nodeDragging) {
        const t = e.changedTouches[0];
        const idx = getNodeAt(t.clientX, t.clientY);
        if (idx >= 0 && idx === nodePointerDown.index) removeNode(idx);
    }
    nodePointerDown = null; nodeDragging = null;
});

function removeNode(idx) {
    state.nodes.splice(idx, 1);
    state.nodes.forEach((n, i) => n.label = `Node ${i+1}`);
    renderNodeList();
    markNodeDirty();
    if (state.nodes.length < MAX_NODES && state.nodeEditMode) btnAddNode.disabled = false;
    nodeTip.style.display = state.nodeEditMode && state.nodes.length > 0 ? 'block' : 'none';
}

// ─────────────────────────────────────────────────────────────────────────────
// UI BINDINGS
// ─────────────────────────────────────────────────────────────────────────────
const btnRecord  = document.getElementById('btn-record');
const btnCapture = document.getElementById('btn-capture');

btnRecord.addEventListener('click', () => isRecording ? stopRecording() : startRecording());

// Recording resolution presets [label, w, h]
const REC_PRESETS = [
    ['720 × 480',   720,  480],
    ['1280 × 720',  1280,  720],
    ['1920 × 1080', 1920, 1080],
    ['2560 × 1440', 2560, 1440],
];
let recPresetIdx = 1; // default 720p
let recFPS = 60;

const recResSlider = document.getElementById('rec-res');
const recResVal    = document.getElementById('val-rec-res');
const recFpsSlider = document.getElementById('rec-fps');
const recFpsVal    = document.getElementById('val-rec-fps');

recResSlider.addEventListener('input', e => {
    recPresetIdx = parseInt(e.target.value);
    recResVal.textContent = REC_PRESETS[recPresetIdx][0];
});
recFpsSlider.addEventListener('input', e => {
    recFPS = parseInt(e.target.value);
    recFpsVal.textContent = recFPS + ' fps';
});

let recOffscreen = null, recAnimId = null;

function startRecording() {
    if (!audioCtx) { alert('Capture audio first.'); return; }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const [, REC_W, REC_H] = REC_PRESETS[recPresetIdx];
    recOffscreen = document.createElement('canvas');
    recOffscreen.width = REC_W; recOffscreen.height = REC_H;
    const rCtx = recOffscreen.getContext('2d');
    function compositeFrame() {
        if (!isRecording) return;
        rCtx.drawImage(glCanvas, 0, 0, glCanvas.width, glCanvas.height, 0, 0, REC_W, REC_H);
        recAnimId = requestAnimationFrame(compositeFrame);
    }
    recAnimId = requestAnimationFrame(compositeFrame);
    const cs   = recOffscreen.captureStream(recFPS);
    const ad   = audioCtx.createMediaStreamDestination();
    analyser.connect(ad);
    const at = ad.stream.getAudioTracks()[0]; if (at) cs.addTrack(at);
    const mime = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']
        .find(t => MediaRecorder.isTypeSupported(t)) || 'video/webm';
    mediaRecorder = new MediaRecorder(cs, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
    recordChunks = [];
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordChunks.push(e.data); };
    mediaRecorder.onstop = () => {
        cancelAnimationFrame(recAnimId); recAnimId = null;
        analyser.disconnect(ad);
        const blob = new Blob(recordChunks, { type: mime });
        const url  = URL.createObjectURL(blob);
        Object.assign(document.createElement('a'), { href: url, download: `lissajous-${Date.now()}.webm` }).click();
        URL.revokeObjectURL(url);
    };
    mediaRecorder.start(); isRecording = true;
    btnRecord.classList.add('recording');
    btnRecord.innerHTML = '<span class="dot"></span>Stop & save';
}
function stopRecording() {
    if (mediaRecorder?.state !== 'inactive') mediaRecorder.stop();
    cancelAnimationFrame(recAnimId); recAnimId = null;
    isRecording = false;
    btnRecord.classList.remove('recording');
    btnRecord.innerHTML = '<span class="dot"></span>Record video';
}

btnCapture.addEventListener('click', async () => {
    if (captureStream) { stopCapture(); return; }
    try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
            video: true,
            audio: { echoCancellation: false, noiseSuppression: false, sampleRate: 44100 }
        });
        stream.getVideoTracks().forEach(t => t.stop());
        const audioTracks = stream.getAudioTracks();
        if (!audioTracks.length) {
            alert('No audio track — tick "Share audio" in the picker.');
            stream.getTracks().forEach(t => t.stop()); return;
        }
        initAudioGraph();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        captureStream = stream;
        captureSource = audioCtx.createMediaStreamSource(captureStream);
        connectSource(captureSource);
        btnCapture.classList.add('active');
        btnCapture.innerHTML = '<span class="dot"></span>Stop capture';
        audioTracks[0].addEventListener('ended', stopCapture);
    } catch(err) {
        if (err.name !== 'NotAllowedError') alert(`Capture failed: ${err.message}`);
    }
});
function stopCapture() {
    captureStream?.getTracks().forEach(t => t.stop());
    captureSource?.disconnect();
    captureStream = captureSource = null;
    btnCapture.classList.remove('active');
    btnCapture.innerHTML = '<span class="dot"></span>Capture app / tab';
}

// Color pickers
document.getElementById('color-picker').oninput = e => {
    state.color = e.target.value;
    document.documentElement.style.setProperty('--accent', state.color);
};
document.getElementById('bg-color-picker').oninput = e => {
    state.bgColor = e.target.value;
    document.documentElement.style.setProperty('--bg', state.bgColor);
    document.body.style.background = state.bgColor;
    const hex = e.target.value.slice(1);
    const r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);
    const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
    const dark = lum < 0.5;
    document.documentElement.style.setProperty('--border',     dark ? 'rgba(255,255,255,0.13)' : 'rgba(0,0,0,0.13)');
    document.documentElement.style.setProperty('--border-mid', dark ? 'rgba(255,255,255,0.28)' : 'rgba(0,0,0,0.28)');
    document.documentElement.style.setProperty('--panel-bg',   dark ? 'rgba(10,10,10,0.88)'    : 'rgba(255,255,255,0.92)');
    document.documentElement.style.setProperty('--text-muted', dark ? 'rgba(255,255,255,0.7)'  : 'rgba(0,0,0,0.7)');
    document.documentElement.style.setProperty('--text-dim',   dark ? 'rgba(255,255,255,0.4)'  : 'rgba(0,0,0,0.42)');
};

// Sliders
function bindSlider(id, fmt, cb) {
    const el = document.getElementById('fx-' + id);
    const dv = document.getElementById('val-' + id);
    if (!el) return;
    el.oninput = e => { const v = parseFloat(e.target.value); if (dv) dv.textContent = fmt(v); cb(v); };
}
bindSlider('liss-density', v => Math.round(v), v => {
    state.lissOffset = Math.round(v);
    document.getElementById('val-liss-density').textContent = Math.round(v);
});
bindSlider('liss-spread',   v => v.toFixed(2), v => { state.lissSpread = v; });
bindSlider('thickness',    v => v.toFixed(2), v => state.thickness = v);
bindSlider('node-radius',  v => Math.round(v), v => { state.nodeRadius = v; markNodeDirty(); });
bindSlider('node-glow',    v => v.toFixed(2), v => { state.nodeGlow = v; markNodeDirty(); });

// ─── Drag-to-rotate on main canvas ───────────────────────────────────────────
{
    let dragRotating = false;
    let rotLastX = 0;

    glCanvas.addEventListener('mousedown', e => {
        // Don't capture if in node edit mode (node canvas handles that)
        if (state.nodeEditMode) return;
        dragRotating = true;
        rotLastX = e.clientX;
        glCanvas.style.cursor = 'grabbing';
        e.preventDefault();
    });
    window.addEventListener('mousemove', e => {
        if (!dragRotating) return;
        const dx = e.clientX - rotLastX;
        rotLastX = e.clientX;
        drawPhase += dx * 0.008;
    });
    window.addEventListener('mouseup', () => {
        if (!dragRotating) return;
        dragRotating = false;
        glCanvas.style.cursor = 'grab';
    });

    // Touch support
    glCanvas.addEventListener('touchstart', e => {
        if (state.nodeEditMode) return;
        dragRotating = true;
        rotLastX = e.touches[0].clientX;
    }, { passive: true });
    window.addEventListener('touchmove', e => {
        if (!dragRotating) return;
        const dx = e.touches[0].clientX - rotLastX;
        rotLastX = e.touches[0].clientX;
        drawPhase += dx * 0.008;
    }, { passive: true });
    window.addEventListener('touchend', () => { dragRotating = false; });

    glCanvas.style.cursor = 'grab';
}

// Version
const btnVersion = document.getElementById('btn-version');
btnVersion.addEventListener('click', () => {
    if (state.mode === 'lissajous') {
        state.mode = 'legacy'; btnVersion.textContent = 'Switch to V2 ↻'; btnVersion.classList.add('legacy');
    } else {
        state.mode = 'lissajous'; btnVersion.textContent = 'Switch to Legacy ↻'; btnVersion.classList.remove('legacy');
    }
    drawPhase = 0;
});

// Hamburger
const controls  = document.getElementById('controls');
const hamburger = document.getElementById('hamburger');
let guiVisible  = true;
hamburger.onclick = () => { guiVisible = !guiVisible; controls.classList.toggle('hidden', !guiVisible); };

function makeDraggable(panel, handle) {
    let sx, sy, ox, oy, drag = false;
    handle.addEventListener('mousedown', e => {
        if (e.button) return; drag = true; sx = e.clientX; sy = e.clientY;
        const r = panel.getBoundingClientRect(); ox = r.left; oy = r.top;
        panel.style.transition = 'none'; e.preventDefault();
    });
    window.addEventListener('mousemove', e => {
        if (!drag) return;
        panel.style.left = Math.max(0, ox + e.clientX - sx) + 'px';
        panel.style.top  = Math.max(0, oy + e.clientY - sy) + 'px';
    });
    window.addEventListener('mouseup', () => { if (!drag) return; drag = false; panel.style.transition = ''; });
}
makeDraggable(controls, document.getElementById('controls-handle'));
makeDraggable(hamburger, hamburger);

// ─── Node UI ──────────────────────────────────────────────────────────────────
const btnNodesEdit = document.getElementById('btn-nodes-edit');
const btnAddNode   = document.getElementById('btn-add-node');
const nodeListEl   = document.getElementById('node-list');
const nodeTip      = document.getElementById('node-tip');
const nodeOverlay  = document.getElementById('node-color-overlay');

btnNodesEdit.addEventListener('click', () => {
    state.nodeEditMode = !state.nodeEditMode;
    btnNodesEdit.textContent = state.nodeEditMode ? 'Done Editing ✓' : 'Edit Nodes';
    btnNodesEdit.classList.toggle('active', state.nodeEditMode);
    btnAddNode.disabled = !state.nodeEditMode;
    nodeTip.style.display = state.nodeEditMode && state.nodes.length > 0 ? 'block' : 'none';
    nodeCanvas.style.pointerEvents = state.nodeEditMode ? 'auto' : 'none';
    glCanvas.style.cursor = state.nodeEditMode ? 'default' : 'grab';
    markNodeDirty();
});
btnAddNode.addEventListener('click', () => {
    if (state.nodes.length >= MAX_NODES) return;
    nodeOverlay.classList.add('visible');
});
document.getElementById('node-color-cancel').addEventListener('click',  () => nodeOverlay.classList.remove('visible'));
document.getElementById('node-color-confirm').addEventListener('click', () => {
    nodeOverlay.classList.remove('visible');
    const color = document.getElementById('new-node-color-input').value;
    const rgb   = hexToRgb(color);
    state.nodes.push({
        x: glCanvas.width / 2, y: glCanvas.height / 2,
        color, r: rgb.r, g: rgb.g, b: rgb.b,
        label: `Node ${state.nodes.length + 1}`
    });
    renderNodeList();
    markNodeDirty();
    nodeTip.style.display = 'block';
    if (state.nodes.length >= MAX_NODES) btnAddNode.disabled = true;
});

function renderNodeList() {
    nodeListEl.innerHTML = '';
    state.nodes.forEach((nd, i) => {
        const item = document.createElement('div');
        item.className = 'node-item';
        item.innerHTML = `
            <span class="node-swatch" style="background:${nd.color}"></span>
            <span class="node-label">${nd.label}</span>
            <button class="node-remove" data-idx="${i}" title="Remove">✕</button>`;
        nodeListEl.appendChild(item);
    });
    nodeListEl.querySelectorAll('.node-remove').forEach(btn => {
        btn.addEventListener('click', e => {
            removeNode(parseInt(e.currentTarget.dataset.idx));
        });
    });
}
</script>
